<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- 坐标轴 -->
  <line x1="2" y1="14" x2="14" y2="14" stroke="#6897BB" stroke-width="1"/>
  <line x1="2" y1="2"  x2="2"  y2="14" stroke="#6897BB" stroke-width="1"/>

  <!-- 简化蜡烛：两根红（上涨），一根绿（下跌） -->
  <rect x="3.5" y="9"  width="2.5" height="4" rx="0.3" fill="#4CAF50"/>
  <rect x="7"   y="6"  width="2.5" height="5" rx="0.3" fill="#E53935"/>
  <rect x="10.5" y="3" width="2.5" height="7" rx="0.3" fill="#E53935"/>

  <!-- 趋势线 -->
  <polyline points="2,12 4.75,11 8.25,9 12,6"
            fill="none" stroke="#FFC107" stroke-width="1.2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
