<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#152B47"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形（深色主题偏亮一些） -->
  <rect width="40" height="40" rx="8" fill="url(#bg)"/>

  <!-- 坐标轴 -->
  <line x1="6" y1="34" x2="34" y2="34" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="6" y1="6"  x2="6"  y2="34" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- 蜡烛 1（绿色）-->
  <line x1="12" y1="20" x2="12" y2="30" stroke="#81C784" stroke-width="1.5"/>
  <rect x="9.5" y="23" width="5" height="6" rx="0.5" fill="#81C784"/>

  <!-- 蜡烛 2（红色）-->
  <line x1="20" y1="14" x2="20" y2="28" stroke="#EF9A9A" stroke-width="1.5"/>
  <rect x="17.5" y="17" width="5" height="8" rx="0.5" fill="#EF9A9A"/>

  <!-- 蜡烛 3（红色）-->
  <line x1="28" y1="10" x2="28" y2="25" stroke="#EF9A9A" stroke-width="1.5"/>
  <rect x="25.5" y="13" width="5" height="9" rx="0.5" fill="#EF9A9A"/>

  <!-- 上升趋势线 -->
  <polyline points="8,29 12,25.5 20,21 28,16.5 34,13"
            fill="none" stroke="#FFE082" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
